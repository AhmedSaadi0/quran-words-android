name: CI

on:
  push:
    branches: [ main, develop, 'refactor/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        # Note: project uses gradle wrapper via binary at ~/.gradle/wrapper/dists; if gradlew is missing, generate it via `gradle wrapper`
      - name: Run ktlintCheck
        run: ./gradlew ktlintCheck --console=plain || echo "ktlint not configured yet — skipping"
      - name: Run detekt
        run: ./gradlew detekt --console=plain || echo "detekt not configured yet — skipping"
      - name: Run lintDebug
        run: ./gradlew lintDebug --console=plain
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --console=plain
      - name: Assemble Debug
        run: ./gradlew assembleDebug --console=plain
